services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourPassword123!
      - MSSQL_PID=Express
    volumes:
      - db_data:/var/opt/mssql
    networks:
      - app-network

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    networks:
      - app-network

  comment_api:
    build:
      context: .
      dockerfile: CommentSystem.Presentation/Dockerfile

    container_name: comment_api

    ports:
      - "5000:5000"

    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000

      - ConnectionStrings__DefaultConnection=Server=sqlserver,1433;Database=CommentSystemDb;User Id=sa;Password=YourPassword123!;TrustServerCertificate=true;

      - Redis__Host=redis:6379

      - RabbitMQ__HostName=rabbitmq
      - RabbitMQ__Port=5672
      - RabbitMQ__UserName=guest
      - RabbitMQ__Password=guest
      - RabbitMQ__VirtualHost=/
      - RabbitMQ__QueueName=comment-created-events

    depends_on:
      - sqlserver
      - redis
      - rabbitmq

    networks:
      - app-network

  comment_client:
    build:
      context: ./comment-demo-client
      dockerfile: Dockerfile

    container_name: comment_client

    ports:
      - "3000:3000"

    depends_on:
      - comment_api

    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge